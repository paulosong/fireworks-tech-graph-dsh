name: Publish to npm

# Publishes the package to the public npm registry. Triggered when you create a
# GitHub Release (recommended flow: merge a sync PR, then cut a release with the
# new version tag). Requires a repo secret NPM_TOKEN (Automation-type token).

on:
  release:
    types: [published]
  # Optional: also publish on tag push.
  # push:
  #   tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Publish
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
